name: Generate Signing Keystore

# Manual trigger only - run this ONCE, then save the output as GitHub secrets
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias name'
        required: true
        default: 'share-to-nostr'
      cn_name:
        description: 'Your name (for certificate CN)'
        required: true
        default: 'Share to Nostr Developer'
      validity_years:
        description: 'Certificate validity in years'
        required: true
        default: '25'

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Generate random passwords
        id: passwords
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity $(( ${{ inputs.validity_years }} * 365 )) \
            -keystore release.keystore \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -dname "CN=${{ inputs.cn_name }}"

      - name: Encode keystore to base64
        id: encode
        run: |
          KEYSTORE_BASE64=$(base64 -w 0 release.keystore)
          echo "keystore_base64=$KEYSTORE_BASE64" >> "$GITHUB_OUTPUT"

      - name: Print instructions
        run: |
          echo "============================================="
          echo "  KEYSTORE GENERATED SUCCESSFULLY"
          echo "============================================="
          echo ""
          echo "Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "Create these 4 repository secrets:"
          echo ""
          echo "1) KEYSTORE_BASE64"
          echo "   Value: ${{ steps.encode.outputs.keystore_base64 }}"
          echo ""
          echo "2) KEYSTORE_PASSWORD"
          echo "   Value: ${{ steps.passwords.outputs.store_pass }}"
          echo ""
          echo "3) KEY_ALIAS"
          echo "   Value: ${{ inputs.key_alias }}"
          echo ""
          echo "4) KEY_PASSWORD"
          echo "   Value: ${{ steps.passwords.outputs.key_pass }}"
          echo ""
          echo "============================================="
          echo "  SAVE THESE VALUES NOW - they won't be"
          echo "  shown again after this run completes!"
          echo "============================================="
          echo ""
          echo "After adding the secrets, push a new tag"
          echo "(e.g. v0.1.1) to build signed release APKs."

      - name: Clean up keystore file
        if: always()
        run: rm -f release.keystore
